name: Deploy Azure serverless

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: azure-production
  cancel-in-progress: false

env:
  RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'rg-uk-market-ai-trader' }}
  LOCATION: ${{ vars.AZURE_LOCATION || 'uksouth' }}
  PREFIX: ukmai
  APP_NAME: uk-market-ai-trader
  API_AUDIENCE: ${{ vars.AZURE_API_AUDIENCE }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Create resource group
        run: az group create --name "$RESOURCE_GROUP" --location "$LOCATION" --output none

      - name: Deploy serverless base
        run: |
          az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --name serverless-base \
            --template-file infra/main.bicep \
            --parameters \
              location="$LOCATION" \
              prefix="$PREFIX" \
              apiAudience="$API_AUDIENCE" \
            --output none

      - name: Read infrastructure outputs
        id: infra
        shell: bash
        run: |
          ACR_NAME=$(az deployment group show -g "$RESOURCE_GROUP" -n serverless-base --query properties.outputs.acrName.value -o tsv)
          ACR_LOGIN_SERVER=$(az deployment group show -g "$RESOURCE_GROUP" -n serverless-base --query properties.outputs.acrLoginServer.value -o tsv)
          ENVIRONMENT_NAME=$(az deployment group show -g "$RESOURCE_GROUP" -n serverless-base --query properties.outputs.environmentName.value -o tsv)
          IDENTITY_NAME=$(az deployment group show -g "$RESOURCE_GROUP" -n serverless-base --query properties.outputs.identityName.value -o tsv)
          KEY_VAULT_NAME=$(az deployment group show -g "$RESOURCE_GROUP" -n serverless-base --query properties.outputs.keyVaultName.value -o tsv)
          KEY_VAULT_URL=$(az deployment group show -g "$RESOURCE_GROUP" -n serverless-base --query properties.outputs.keyVaultUrl.value -o tsv)
          MODEL_STORAGE_URL=$(az deployment group show -g "$RESOURCE_GROUP" -n serverless-base --query properties.outputs.storageAccountUrl.value -o tsv)
          FRONTEND_STORAGE=$(az deployment group show -g "$RESOURCE_GROUP" -n serverless-base --query properties.outputs.frontendStorageName.value -o tsv)
          FRONTEND_URL=$(az deployment group show -g "$RESOURCE_GROUP" -n serverless-base --query properties.outputs.frontendUrl.value -o tsv)
          MARKET_FEED_FUNCTION=$(az deployment group show -g "$RESOURCE_GROUP" -n serverless-base --query properties.outputs.marketFeedFunctionName.value -o tsv)
          MARKET_FEED_URL=$(az deployment group show -g "$RESOURCE_GROUP" -n serverless-base --query properties.outputs.marketFeedUrl.value -o tsv)
          FRONTEND_ORIGIN="${FRONTEND_URL%/}"

          echo "acr_name=$ACR_NAME" >> "$GITHUB_OUTPUT"
          echo "acr_login_server=$ACR_LOGIN_SERVER" >> "$GITHUB_OUTPUT"
          echo "environment_name=$ENVIRONMENT_NAME" >> "$GITHUB_OUTPUT"
          echo "identity_name=$IDENTITY_NAME" >> "$GITHUB_OUTPUT"
          echo "key_vault_name=$KEY_VAULT_NAME" >> "$GITHUB_OUTPUT"
          echo "key_vault_url=$KEY_VAULT_URL" >> "$GITHUB_OUTPUT"
          echo "model_storage_url=$MODEL_STORAGE_URL" >> "$GITHUB_OUTPUT"
          echo "frontend_storage=$FRONTEND_STORAGE" >> "$GITHUB_OUTPUT"
          echo "frontend_url=$FRONTEND_URL" >> "$GITHUB_OUTPUT"
          echo "frontend_origin=$FRONTEND_ORIGIN" >> "$GITHUB_OUTPUT"
          echo "market_feed_function=$MARKET_FEED_FUNCTION" >> "$GITHUB_OUTPUT"
          echo "market_feed_url=$MARKET_FEED_URL" >> "$GITHUB_OUTPUT"

      - name: Grant deploy identity Key Vault secret write access
        if: ${{ env.TWELVE_DATA_API_KEY != '' }}
        shell: bash
        run: |
          DEPLOY_OBJECT_ID=$(az ad sp show \
            --id "${{ vars.AZURE_CLIENT_ID }}" \
            --query id \
            -o tsv)

          VAULT_ID=$(az keyvault show \
            --name "${{ steps.infra.outputs.key_vault_name }}" \
            --query id \
            -o tsv)

          az role assignment create \
            --assignee-object-id "$DEPLOY_OBJECT_ID" \
            --assignee-principal-type ServicePrincipal \
            --role "Key Vault Secrets Officer" \
            --scope "$VAULT_ID" \
            --output none

      - name: Store Twelve Data API key in Key Vault
        if: ${{ env.TWELVE_DATA_API_KEY != '' }}
        shell: bash
        run: |
          for attempt in 1 2 3 4 5 6; do
            if az keyvault secret set \
              --vault-name "${{ steps.infra.outputs.key_vault_name }}" \
              --name twelve-data-api-key \
              --value "$TWELVE_DATA_API_KEY" \
              --output none; then
              exit 0
            fi

            echo "Key Vault RBAC may still be propagating; retrying in 10 seconds..."
            sleep 10
          done

          echo "Unable to store Twelve Data API key after RBAC retries."
          exit 1

      - name: Deploy market feed function
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ steps.infra.outputs.market_feed_function }}
          package: market_feed
          scm-do-build-during-deployment: true
          enable-oryx-build: true

      - name: Enable static website hosting
        shell: bash
        run: |
          ACCOUNT_KEY=$(az storage account keys list \
            --resource-group "$RESOURCE_GROUP" \
            --account-name "${{ steps.infra.outputs.frontend_storage }}" \
            --query "[0].value" -o tsv)

          az storage blob service-properties update \
            --account-name "${{ steps.infra.outputs.frontend_storage }}" \
            --account-key "$ACCOUNT_KEY" \
            --static-website \
            --index-document index.html \
            --404-document index.html \
            --output none

      - name: Build container in ACR
        run: |
          az acr build \
            --registry "${{ steps.infra.outputs.acr_name }}" \
            --image "uk-market-ai-trader:${GITHUB_SHA}" \
            .

      - name: Deploy Container App
        run: |
          IMAGE="${{ steps.infra.outputs.acr_login_server }}/uk-market-ai-trader:${GITHUB_SHA}"

          az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --name "app-${GITHUB_RUN_ID}" \
            --template-file infra/app.bicep \
            --parameters \
              location="$LOCATION" \
              appName="$APP_NAME" \
              environmentName="${{ steps.infra.outputs.environment_name }}" \
              acrName="${{ steps.infra.outputs.acr_name }}" \
              identityName="${{ steps.infra.outputs.identity_name }}" \
              keyVaultUrl="${{ steps.infra.outputs.key_vault_url }}" \
              tenantId="${{ vars.AZURE_TENANT_ID }}" \
              apiAudience="${{ vars.AZURE_API_AUDIENCE }}" \
              frontendOrigin="${{ steps.infra.outputs.frontend_origin }}" \
              modelStorageAccountUrl="${{ steps.infra.outputs.model_storage_url }}" \
              image="$IMAGE" \
            --output none

      - name: Read API URL
        id: app
        shell: bash
        run: |
          FQDN=$(az containerapp show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$APP_NAME" \
            --query "properties.configuration.ingress.fqdn" \
            -o tsv)
          echo "api_url=https://$FQDN" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate frontend runtime config
        shell: bash
        run: |
          SPA_CLIENT_ID="${API_AUDIENCE#api://}"
          cat > frontend/public/config.js <<EOF
          window.__APP_CONFIG__ = {
            apiBaseUrl: "${{ steps.app.outputs.api_url }}",
            marketFeedBaseUrl: "${{ steps.infra.outputs.market_feed_url }}",
            marketFeedRefreshMs: 60000,
            entraClientId: "$SPA_CLIENT_ID",
            tenantId: "${{ vars.AZURE_TENANT_ID }}",
            apiScope: "${{ vars.AZURE_API_AUDIENCE }}/access_as_user"
          };
          EOF

      - name: Build frontend
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Publish static frontend
        shell: bash
        run: |
          ACCOUNT_KEY=$(az storage account keys list \
            --resource-group "$RESOURCE_GROUP" \
            --account-name "${{ steps.infra.outputs.frontend_storage }}" \
            --query "[0].value" -o tsv)

          az storage blob upload-batch \
            --account-name "${{ steps.infra.outputs.frontend_storage }}" \
            --account-key "$ACCOUNT_KEY" \
            --destination '$web' \
            --source frontend/dist \
            --overwrite \
            --output none

          az storage blob upload \
            --account-name "${{ steps.infra.outputs.frontend_storage }}" \
            --account-key "$ACCOUNT_KEY" \
            --container-name '$web' \
            --name index.html \
            --file frontend/dist/index.html \
            --overwrite \
            --content-type "text/html" \
            --content-cache-control "no-store, no-cache, must-revalidate" \
            --output none

          az storage blob upload \
            --account-name "${{ steps.infra.outputs.frontend_storage }}" \
            --account-key "$ACCOUNT_KEY" \
            --container-name '$web' \
            --name config.js \
            --file frontend/dist/config.js \
            --overwrite \
            --content-type "application/javascript" \
            --content-cache-control "no-store, no-cache, must-revalidate" \
            --output none

      - name: Smoke test API and frontend
        shell: bash
        run: |
          echo "API URL: ${{ steps.app.outputs.api_url }}"
          echo "Frontend URL: ${{ steps.infra.outputs.frontend_url }}"

          curl --fail --retry 8 --retry-delay 10 "${{ steps.app.outputs.api_url }}/health"
          curl --fail --retry 8 --retry-delay 5 "${{ steps.infra.outputs.frontend_url }}"
          curl --fail -X OPTIONS "${{ steps.infra.outputs.market_feed_url }}/quote"
