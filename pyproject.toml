[project]
name = "uk-market-ai-trader"
version = "0.1.0"
description = "Azure-first UK equity prediction and paper-trading research platform"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "scikit-learn>=1.5",
  "xgboost>=2.1",
  "lightgbm>=4.5",
  "catboost>=1.2",
  "joblib>=1.4",
  "pydantic>=2.8",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-dotenv>=1.0",
  "yfinance>=0.2.54",
  "azure-identity>=1.17",
  "azure-keyvault-secrets>=4.8",
  "azure-storage-blob>=12.23",
  "pyjwt[crypto]>=2.9",
  "httpx>=0.27"
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.6"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[project.scripts]
uk-market-predict = "src.cli:main"
